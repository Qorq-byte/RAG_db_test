log_level = "INFO"

[storage]
data_dir = ".data"
sqlite_filename = "ragdb.sqlite3"
chroma_directory = "chroma"

[embedding]
provider = "local"
local_model = "BAAI/bge-small-zh-v1.5"
cloud_model = "text-embedding-3-small"
cloud_base_url = "https://api.openai.com/v1"
cloud_timeout_seconds = 30.0
batch_size = 16

[chunking]
max_characters = 1200
overlap_characters = 200

[retrieval]
vector_top_k = 20
keyword_top_k = 20
result_top_k = 10
rrf_k = 60

[crawl]
max_depth = 1
max_pages = 50
requests_per_second = 1.0
timeout_seconds = 20.0
user_agent = "ragdb/0.1"
retry_count = 2

[rerank]
enabled = false
candidate_count = 20
batch_size = 4

[ocr]
enabled = false
executable_path = "D:/Dinstall/Tesseract-OCR/tesseract.exe"
languages = "chi_sim+eng"
dpi = 200

[chat]
provider = "local"
local_model = "qwen2.5:7b"
local_base_url = "http://127.0.0.1:11434"
local_timeout_seconds = 120.0
cloud_model = "gpt-4.1-mini"
cloud_base_url = "https://api.openai.com/v1"
cloud_timeout_seconds = 60.0
evidence_limit = 6
evidence_character_budget = 12000
history_character_budget = 6000

# 本项目选择的非敏感模型配置。云端密钥通过系统凭据库或环境变量提供。
[embedding]
provider = "ollama"
ollama_model = "embeddinggemma:latest"
ollama_base_url = "http://127.0.0.1:11434"
local_model = "BAAI/bge-small-zh-v1.5"
ollama_timeout_seconds = 120.0
cloud_model = "qwen3.7-text-embedding-flash"
cloud_base_url = "https://ws-0fjy3d6lhhxhctuy.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
cloud_timeout_seconds = 30.0
batch_size = 14

[chat]
provider = "cloud"
cloud_model = "deepseek-flash"
cloud_base_url = "https://api.deepseek.com"
cloud_timeout_seconds = 60.0
local_model = "qwen2.5:7b"
local_base_url = "http://127.0.0.1:11434"
local_timeout_seconds = 120.0
evidence_limit = 6
evidence_character_budget = 12000
history_character_budget = 6000

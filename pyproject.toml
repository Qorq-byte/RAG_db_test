[project]
name = "rag-db-test"
version = "0.1.0"
description = "面向人工智能学习的个人 RAG 知识库"
requires-python = ">=3.11,<3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.0",
    "keyring>=25.6.0",
    "pydantic-settings",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.2",
    "rich",
    "sentence-transformers>=3.0.0",
    "typer",
    "tomlkit>=0.13.3",
    "trafilatura>=2.0.0",
    "watchdog>=6.0.0",
    "pyside6>=6.8,<7",
]

[project.scripts]
ragdb = "ragdb.cli:app"
ragdb-gui = "ragdb.desktop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdb"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

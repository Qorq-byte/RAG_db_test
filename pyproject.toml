[project]
name = "rag-db-test"
version = "0.1.0"
description = "面向人工智能学习的个人 RAG 知识库"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic-settings",
    "rich",
    "typer",
]

[project.scripts]
ragdb = "ragdb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdb"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
